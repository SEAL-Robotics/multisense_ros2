initialization:
  sensor_ip:
      type: string
      default_value: "10.66.171.21"
      read_only: true
      description: "MultiSense IP Address"
  sensor_mtu:
      type: int
      default_value: 1500
      read_only: true
      description: "MultiSense MTU"
      validation:
          bounds<>: [1500, 9000]
  tf_prefix:
      type: string
      default_value: "multisense"
      read_only: true
      description: "TF2 prefix for this camera"
  publish_static_tf:
      type: bool
      default_value: true
      read_only: true
      description: "Publish static TF transforms for the camera optical frames"
  use_image_transport:
      type: bool
      default_value: false
      read_only: true
      description: "Use image transport for publishing image topics"
  h264_images:
      type: bool
      default_value: false
      read_only: true
      description: "Request the left/right mono and rectified images from the camera as H.264 and
                     decode them on the host, publishing the same MONO8 topics. Disparity, aux and
                     cost stay raw. Needs a build with GStreamer"
  aux_jpeg:
      type: bool
      default_value: false
      read_only: true
      description: "Publish aux/image_rect_color/compressed, a JPEG encoded from the aux camera's own
                     YCbCr planes (NVJPG on a Jetson, else libjpeg), only while it has a subscriber.
                     Needs a build with GStreamer"
  aux_jpeg_quality:
      type: int
      default_value: 75
      read_only: true
      description: "JPEG quality of aux/image_rect_color/compressed, 1-100"
      validation:
          bounds<>: [1, 100]
  use_sensor_qos:
      type: bool
      default_value: false
      read_only: true
      description: "Use the SensorDataQoS which publishes image over UDP instead of the system default QOS"
  reconnect:
      type: bool
      default_value: false
      read_only: true
      description: "Try to reconnect to the camera if there are any connection issues detected"
  reconnect_timeout_s:
      type: int
      default_value: 5
      read_only: true
      description: "The time, in seconds, for communications from the MultiSense to drop before reconnecting.
                     reconnect must be set to True for this to apply"
